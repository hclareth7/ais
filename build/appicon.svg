<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.42">
      <stop offset="0%" stop-color="#7BA0FF" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#7BA0FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#7BA0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letterGrad" x1="0.5" y1="0.2" x2="0.5" y2="0.9">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#1a1d24"/>
    </linearGradient>
    <filter id="letterGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#7BA0FF" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in" result="glowColor"/>
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White background with rounded corners -->
  <rect width="1024" height="1024" rx="228" fill="#F8F9FB"/>

  <!-- Subtle illumination halo -->
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- Subtle border -->
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>

  <!-- Letter "a" as text — using system sans-serif which maps to Inter-like font -->
  <g filter="url(#letterGlow)">
    <text x="512" y="660" text-anchor="middle" font-family="Inter" font-size="580" font-weight="600" letter-spacing="-0.02em" fill="url(#letterGrad)">a</text>
  </g>
</svg>
